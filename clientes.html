<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Ventas Online — Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body style="visibility:hidden">

<div class="layout">
  <nav class="sidebar">
    <a href="index.html" class="marca">
      <img src="img/logo-horizontal-oscuro.svg" alt="Control de Ventas" width="180">
    </a>
    <a href="index.html" class="nav-link"><svg class="icono" aria-hidden="true"><use href="img/iconos.svg#resumen"/></svg> Resumen</a>
    <a href="pedidos.html" class="nav-link"><svg class="icono" aria-hidden="true"><use href="img/iconos.svg#pedidos"/></svg> Pedidos</a>
    <a href="clientes.html" class="nav-link activo"><svg class="icono" aria-hidden="true"><use href="img/iconos.svg#clientes"/></svg> Clientes</a>
    <a href="fondo.html" class="nav-link"><svg class="icono" aria-hidden="true"><use href="img/iconos.svg#fondo"/></svg> Fondo</a>
    <a href="#" class="nav-link boton-logout"><svg class="icono" aria-hidden="true"><use href="img/iconos.svg#cerrar-sesion"/></svg> Cerrar sesión</a>
  </nav>

  <main class="contenido">
    <header class="encabezado">
      <h1>Clientes</h1>
    </header>

    <div class="bloque">
      <h2>Cliente nuevo</h2>
      <form id="form-nuevo-cliente">
        <div class="campo">
          <label for="input-nombre-cliente">Nombre</label>
          <input type="text" id="input-nombre-cliente" required>
        </div>
        <div class="campo">
          <label for="input-telefono-cliente">Teléfono (opcional)</label>
          <input type="text" id="input-telefono-cliente">
        </div>
        <button type="submit" class="boton">Agregar cliente</button>
      </form>
    </div>

    <div class="bloque">
      <h2>Todos los clientes</h2>
      <div id="lista-clientes" class="ledger"></div>
    </div>
  </main>
</div>

<nav class="nav-movil">
  <a href="index.html" class="nav-movil-link"><svg class="icono" aria-hidden="true"><use href="img/iconos.svg#resumen"/></svg> Resumen</a>
  <a href="pedidos.html" class="nav-movil-link"><svg class="icono" aria-hidden="true"><use href="img/iconos.svg#pedidos"/></svg> Pedidos</a>
  <a href="clientes.html" class="nav-movil-link activo"><svg class="icono" aria-hidden="true"><use href="img/iconos.svg#clientes"/></svg> Clientes</a>
  <a href="fondo.html" class="nav-movil-link"><svg class="icono" aria-hidden="true"><use href="img/iconos.svg#fondo"/></svg> Fondo</a>
  <a href="#" class="nav-movil-link boton-logout"><svg class="icono" aria-hidden="true"><use href="img/iconos.svg#cerrar-sesion"/></svg> Salir</a>
</nav>

<script type="module" src="js/auth-guard.js"></script>
<script type="module" src="js/clientes.js"></script>
</body>
</html>
