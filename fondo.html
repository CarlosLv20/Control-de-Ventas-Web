<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Ventas Online — Fondo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body style="visibility:hidden">

<div class="layout">
  <nav class="sidebar">
    <div class="marca">Control de Ventas<span>Online</span></div>
    <a href="index.html" class="nav-link">Resumen</a>
    <a href="pedidos.html" class="nav-link">Pedidos</a>
    <a href="clientes.html" class="nav-link">Clientes</a>
    <a href="fondo.html" class="nav-link activo">Fondo</a>
    <a href="#" class="nav-link boton-logout">Cerrar sesión</a>
  </nav>

  <main class="contenido">
    <header class="encabezado">
      <h1>Fondo</h1>
    </header>

    <section class="hero-saldo">
      <p class="hero-etiqueta">Saldo actual</p>
      <p class="hero-numero" id="saldo-fondo">$0.00</p>
    </section>

    <div class="bloque">
      <h2>Registrar movimiento</h2>
      <form id="form-movimiento">
        <div class="campo">
          <label for="input-tipo-movimiento">Tipo</label>
          <select id="input-tipo-movimiento">
            <option value="gasto">Gasto (algo que salió del fondo)</option>
            <option value="retiro">Retiro (tú o tu hermana sacan dinero)</option>
            <option value="aporte">Aporte (metes dinero propio al fondo)</option>
          </select>
        </div>
        <div class="campo">
          <label for="input-monto-movimiento">Monto</label>
          <input type="number" step="0.01" id="input-monto-movimiento" required>
        </div>
        <div class="campo">
          <label for="input-nota-movimiento">Nota</label>
          <input type="text" id="input-nota-movimiento" placeholder="Ej. Comida de la salida del sábado">
        </div>
        <button type="submit" class="boton">Registrar</button>
      </form>
    </div>

    <div class="bloque">
      <h2>Historial completo</h2>
      <div id="lista-movimientos" class="ledger"></div>
    </div>
  </main>
</div>

<nav class="nav-movil">
  <a href="index.html" class="nav-movil-link">Resumen</a>
  <a href="pedidos.html" class="nav-movil-link">Pedidos</a>
  <a href="clientes.html" class="nav-movil-link">Clientes</a>
  <a href="fondo.html" class="nav-movil-link activo">Fondo</a>
  <a href="#" class="nav-movil-link boton-logout">Salir</a>
</nav>

<script type="module" src="js/auth-guard.js"></script>
<script type="module" src="js/fondo.js"></script>
</body>
</html>
