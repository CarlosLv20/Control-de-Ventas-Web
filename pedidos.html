<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Ventas Online — Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body style="visibility:hidden">

<div class="layout">
  <nav class="sidebar">
    <div class="marca">Control de Ventas<span>Online</span></div>
    <a href="index.html" class="nav-link">Resumen</a>
    <a href="pedidos.html" class="nav-link activo">Pedidos</a>
    <a href="clientes.html" class="nav-link">Clientes</a>
    <a href="fondo.html" class="nav-link">Fondo</a>
    <a href="#" class="nav-link boton-logout">Cerrar sesión</a>
  </nav>

  <main class="contenido">

    <!-- ===== Vista: lista de pedidos ===== -->
    <section id="vista-lista">
      <header class="encabezado">
        <h1>Pedidos</h1>
      </header>

      <div class="bloque">
        <h2>Nuevo pedido</h2>
        <form id="form-nuevo-pedido">
          <div class="campo">
            <label for="input-numero-pedido">Número de pedido</label>
            <input type="number" id="input-numero-pedido" required>
          </div>
          <button type="submit" class="boton">Crear pedido</button>
        </form>
      </div>

      <div class="bloque">
        <h2>Todos los pedidos</h2>
        <div id="lista-pedidos" class="ledger"></div>
      </div>
    </section>

    <!-- ===== Vista: detalle de un pedido ===== -->
    <section id="vista-detalle" style="display:none">
      <p><a href="pedidos.html" class="boton secundario" style="display:inline-block;margin-bottom:20px;">Volver a pedidos</a></p>

      <header class="encabezado">
        <h1 id="titulo-pedido">Pedido</h1>
        <p class="hero-etiqueta" id="estado-pedido" style="margin-top:6px;"></p>
        <button id="boton-eliminar-pedido" class="boton peligro" style="margin-top:14px;display:none;">Eliminar este pedido</button>
      </header>

      <div class="bloque">
        <h2>Líneas del pedido</h2>
        <div id="lista-lineas" class="ledger"></div>
      </div>

      <div class="bloque" id="bloque-form-linea">
        <h2>Agregar línea</h2>
        <form id="form-linea">
          <div class="campo">
            <label for="input-tipo-linea">Tipo de línea</label>
            <select id="input-tipo-linea">
              <option value="venta">Venta a un cliente</option>
              <option value="personal">Compra personal (mía)</option>
            </select>
          </div>

          <div class="campo" id="campo-cliente">
            <label for="input-cliente">Cliente</label>
            <select id="input-cliente">
              <option value="__nuevo__">+ Cliente nuevo…</option>
            </select>
          </div>

          <div class="campo" id="campo-cliente-nuevo" style="display:none">
            <label for="input-cliente-nuevo">Nombre del cliente nuevo</label>
            <input type="text" id="input-cliente-nuevo">
          </div>

          <div class="campo">
            <label for="input-producto">Producto</label>
            <input type="text" id="input-producto" required>
          </div>

          <div class="campo" id="campo-precio">
            <label for="input-precio">Precio cobrado</label>
            <input type="number" step="0.01" id="input-precio">
          </div>

          <div class="campo" id="campo-costo-personal" style="display:none">
            <label for="input-costo-personal">Costo en Temu (tuyo)</label>
            <input type="number" step="0.01" id="input-costo-personal">
          </div>

          <button type="submit" class="boton">Agregar línea</button>
        </form>
      </div>

      <div class="bloque" id="bloque-cierre">
        <h2>Cerrar pedido</h2>
        <p class="vacio" id="resumen-cierre"></p>
        <form id="form-cierre">
          <div class="campo">
            <label for="input-total-temu">Total gastado en Temu (todo lo pagado con tu tarjeta en este pedido)</label>
            <input type="number" step="0.01" id="input-total-temu" required>
          </div>
          <button type="submit" class="boton">Cerrar pedido y calcular ganancia</button>
        </form>
      </div>

      <div class="bloque" id="bloque-resultado" style="display:none">
        <h2>Pedido cerrado</h2>
        <div class="ledger" id="resultado-cierre"></div>
      </div>
    </section>

  </main>
</div>

<nav class="nav-movil">
  <a href="index.html" class="nav-movil-link">Resumen</a>
  <a href="pedidos.html" class="nav-movil-link activo">Pedidos</a>
  <a href="clientes.html" class="nav-movil-link">Clientes</a>
  <a href="fondo.html" class="nav-movil-link">Fondo</a>
  <a href="#" class="nav-movil-link boton-logout">Salir</a>
</nav>

<script type="module" src="js/auth-guard.js"></script>
<script type="module" src="js/pedidos.js"></script>
</body>
</html>
